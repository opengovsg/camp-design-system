name: Publish (Camp)
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      snapshot:
        description: Create snapshot release
        type: boolean
        default: false

concurrency:
  group: publish-camp
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write
  statuses: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        if: inputs.snapshot != true
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OGP_CHANGESETS_CLIENT_ID }}
          private-key: ${{ secrets.OGP_CHANGESETS_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Publish snapshot to npm
        if: inputs.snapshot == true
        run: |
          pnpm run changeset version --snapshot snapshot
          pnpm run release --tag snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ""

      - name: Create release PR or publish to npm
        if: inputs.snapshot != true
        id: changesets
        uses: opengovsg/changesets-action@f68bb4b781c954856eabd2643d4087c8faa97f2a
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ""

      - uses: actions/setup-node@v4
        if: inputs.snapshot == true || steps.changesets.outputs.hasChangesets == 'false'
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Publish to GitHub Packages
        if: inputs.snapshot == true || steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm run changeset publish --no-git-tag --tag "$RELEASE_TAG"
        env:
          npm_config_registry: https://npm.pkg.github.com
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.snapshot == true && 'snapshot' || 'latest' }}
