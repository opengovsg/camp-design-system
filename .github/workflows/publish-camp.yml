name: Publish (Camp)
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      snapshot:
        description: Create snapshot release
        type: boolean
        default: false

concurrency:
  group: publish-camp
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write
  statuses: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update npm for trusted publishing
        run: npm install -g npm@11
      - run: npm ci

      - name: Publish snapshot to npm
        if: inputs.snapshot == true
        run: |
          npm run changeset -- version --snapshot snapshot
          npm run release -- --tag snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ""

      - name: Create release PR or publish to npm
        if: inputs.snapshot != true
        id: changesets
        uses: opengovsg/changesets-action@f68bb4b781c954856eabd2643d4087c8faa97f2a
        with:
          version: npm run version-packages
          publish: npm run release
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ""

      - uses: actions/setup-node@v4
        if: inputs.snapshot == true || steps.changesets.outputs.hasChangesets == 'false'
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Publish to GitHub Packages
        if: inputs.snapshot == true || steps.changesets.outputs.hasChangesets == 'false'
        run: npm run changeset -- publish --no-git-tag --tag "$RELEASE_TAG"
        env:
          npm_config_registry: https://npm.pkg.github.com
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.snapshot == true && 'snapshot' || 'latest' }}
